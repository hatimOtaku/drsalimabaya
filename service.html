<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prestation | Dr Salima Baya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/jpeg" href="assets/logo.jpg">
<link rel="stylesheet" href="css/style.css?v=8">
</head>
<body data-page="services">
<main>
  <section class="page-hero">
    <div class="container">
      <div class="page-card">
        <img class="page-img" id="pimg" alt="">
        <div class="page-panel">
          <div class="crumb"><a href="index.html#services" data-i18n="svc.page.back"></a> / <span id="crumbName"></span></div>
          <h1 id="svcName"></h1>
          <p id="svcTag"></p>
        </div>
      </div>
    </div>
  </section>

  <section>
    <div class="container svc-layout">
      <div>
        <span class="eyebrow" data-i18n="svc.page.about"></span>
        <h2 id="svcIntroTitle"></h2>
        <p id="svcIntro"></p>
        <h3 data-i18n="svc.page.pts"></h3>
        <ul id="svcPoints"></ul>

        <h3 data-i18n="svc.page.work"></h3>
        <div class="gallery" id="gallery"></div>
        <div class="empty-work" id="emptyWork" hidden>
          <p data-i18n="svc.page.workEmpty"></p>
          <a class="btn btn-rose" href="https://www.instagram.com/drsalimabaya/" target="_blank" rel="noopener" data-i18n="svc.page.insta"></a>
        </div>
        <p class="note" data-i18n="svc.page.note"></p>

        <h3 data-i18n="svc.page.other"></h3>
        <div class="other-grid" id="others"></div>
      </div>
      <aside class="aside-card">
        <h3 data-i18n="svc.page.ask"></h3>
        <p data-i18n="cta.sub"></p>
        <a class="btn btn-wa" id="waAsk" href="#" target="_blank" rel="noopener"><span data-i18n="cta.btn"></span></a>
      </aside>
    </div>
  </section>
</main>
<script src="js/data.js?v=8"></script>
<script src="js/main.js?v=8"></script>
<script>
(function () {
  var slug = new URLSearchParams(location.search).get("s");
  var idx = SERVICES.findIndex(function (s) { return s.slug === slug; });
  if (idx < 0) { location.replace("index.html#services"); return; }
  var svc = SERVICES[idx];
  document.getElementById("pimg").src = "assets/cards/" + slug + ".jpg";

  var gallery = document.getElementById("gallery");
  var photos = (WORK[slug] || []).slice();
  /* The syringe and product shots are not before/after results, so they only show here */
  if (slug === "botox") photos.push("assets/work/botox-1.jpg");
  if (slug === "self-care") photos.push("assets/work/self-care-3.jpg");
  var list = photos.map(function (src, i) { return { src: src, alt: svc.fr.name + " " + (i + 1) }; });
  list.forEach(function (item, i) { gallery.appendChild(DR.shot(item, function () { DR.lightbox(list, i); })); });
  document.getElementById("emptyWork").hidden = list.length > 0;

  function render() {
    var l = DR.lang(), d = svc[l];
    document.title = d.name + " | Dr Salima Baya";
    document.getElementById("svcName").textContent = d.name;
    document.getElementById("crumbName").textContent = d.name;
    document.getElementById("svcTag").textContent = d.tag;
    document.getElementById("svcIntroTitle").textContent = d.name;
    document.getElementById("svcIntro").textContent = d.intro;
    var ul = document.getElementById("svcPoints");
    ul.innerHTML = "";
    d.points.forEach(function (p) { var li = document.createElement("li"); li.textContent = p; ul.appendChild(li); });
    var ot = document.getElementById("others");
    ot.innerHTML = "";
    SERVICES.forEach(function (s) {
      if (s.slug === slug) return;
      var a = document.createElement("a");
      a.className = "chip"; a.href = "service.html?s=" + s.slug; a.textContent = s[l].name;
      ot.appendChild(a);
    });
    var msg = l === "ar"
      ? "مرحباً دكتورة بايا، أرغب في استشارة بخصوص: " + d.name
      : "Bonjour Dr Baya, je souhaite une consultation concernant : " + d.name;
    document.getElementById("waAsk").href = DR.waLink(msg);
  }
  document.addEventListener("langchange", render);
  render();
})();
</script>
</body>
</html>
